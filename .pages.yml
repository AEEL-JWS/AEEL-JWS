# AEEL content editor configuration
media:
  input: public/images
  output: /images
  rename: safe
  categories:
    - image
    - document
content:
  - name: research
    label: Research
    type: collection
    path: src/content/research
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields:
        - title
        - eyebrow
        - order
      primary: title
      sort:
        - order
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: eyebrow
        label: Short label
        type: string
      - name: summary
        label: Summary
        type: text
        required: true
      - name: order
        label: Display order
        type: number
      - name: featured
        label: Feature on home
        type: boolean
      - name: image
        label: Image
        type: image
      - name: body
        label: Full description
        type: rich-text
  - name: members
    label: Members
    type: group
    items:
      - name: professor
        label: Professor
        type: file
        path: src/data/professor.json
        format: json
        operations:
          delete: false
        fields:
          - name: image
            label: Profile image
            type: image
          - name: englishName
            label: English name
            type: string
          - name: koreanName
            label: Korean name
            type: string
          - name: hanjaName
            label: Chinese-character name
            type: string
          - name: degree
            label: Degree or title
            type: string
          - name: position
            label: Position
            type: string
          - name: department
            label: Department
            type: string
          - name: institution
            label: Institution
            type: string
          - name: email
            label: Email
            type: string
          - name: phone
            label: Phone
            type: string
          - name: fax
            label: Fax
            type: string
          - name: office
            label: Office
            type: string
          - name: biography
            label: Short biography
            type: text
          - name: googleScholar
            label: Google Scholar URL
            type: string
          - name: orcid
            label: ORCID URL
            type: string
          - name: researcherProfile
            label: Researcher profile URL
            type: string
          - name: universityProfile
            label: University profile URL
            type: string
          - name: education
            label: Education · Add item
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{degree} · {institution}"
            fields:
              - name: degree
                label: Degree
                type: string
              - name: field
                label: Field
                type: string
              - name: institution
                label: Institution
                type: string
              - name: location
                label: Location
                type: string
              - name: year
                label: Year
                type: number
              - name: order
                label: Display order
                type: number
          - name: experience
            label: Professional experience · Add item
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{position} · {institution}"
            fields:
              - name: institution
                label: Institution
                type: string
              - name: department
                label: Department or organization
                type: string
              - name: position
                label: Position
                type: string
              - name: location
                label: Location
                type: string
              - name: startYear
                label: Start year
                type: number
              - name: endYear
                label: End year
                type: number
              - name: present
                label: Present
                type: boolean
              - name: order
                label: Display order
                type: number
          - name: awards
            label: Honors and awards · Add item
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Award title
                type: string
              - name: organization
                label: Organization
                type: string
              - name: year
                label: Year
                type: number
              - name: description
                label: Description
                type: text
              - name: order
                label: Display order
                type: number
          - name: activities
            label: Academic activities · Add item
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{role}"
            fields:
              - name: role
                label: Activity or role
                type: string
              - name: organization
                label: Organization
                type: string
              - name: startYear
                label: Start year
                type: number
              - name: endYear
                label: End year
                type: number
              - name: present
                label: Present
                type: boolean
              - name: description
                label: Description
                type: text
              - name: order
                label: Display order
                type: number
      - name: people
        label: Researchers
        type: collection
        path: src/content/people
        exclude:
          - jae-won-shim.md
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields:
            - name
            - role
            - order
          primary: name
          sort:
            - order
          default:
            sort: order
            order: asc
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Position
            type: string
            required: true
          - name: affiliation
            label: Joint affiliation (KIST / KETI)
            type: string
          - name: degree
            label: Degree
            type: string
          - name: program
            label: Program
            type: string
          - name: researchArea
            label: Research area
            type: string
          - name: interests
            label: Research interests
            type: text
          - name: introduction
            label: Short introduction
            type: text
          - name: keywords
            label: Research keywords
            type: text
          - name: email
            label: Email
            type: string
          - name: image
            label: Portrait
            type: image
          - name: sourceImageUrl
            label: Original image URL (reference)
            type: string
          - name: active
            label: Show on site
            type: boolean
          - name: link
            label: External link
            type: string
          - name: order
            label: Display order
            type: number
      - name: alumni
        label: Alumni
        type: collection
        path: src/content/alumni
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields:
            - name
            - graduationYear
            - order
          primary: name
          sort:
            - graduationYear
          default:
            sort: graduationYear
            order: asc
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: category
            label: Category (Postdoc / Ph.D. Course / M.S. Course)
            type: string
          - name: degree
            label: Degree
            type: string
          - name: previousPosition
            label: Previous position
            type: string
          - name: graduationYear
            label: Graduation year
            type: number
          - name: graduationMonth
            label: Graduation month
            type: string
          - name: currentStatus
            label: Current status
            type: string
          - name: currentAffiliation
            label: Current affiliation
            type: string
          - name: currentPosition
            label: Current position
            type: string
          - name: currentOrganization
            label: Current organization
            type: string
          - name: currentText
            label: Original current status text
            type: string
          - name: active
            label: Show on site
            type: boolean
          - name: image
            label: Portrait
            type: image
          - name: link
            label: External link
            type: string
          - name: order
            label: Display order
            type: number
  - name: publication_group
    label: Publications
    type: group
    items:
      - name: publications
        label: Papers
        type: collection
        path: src/content/publications
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields:
            - title
            - journal
            - year
            - featured
          primary: title
          sort:
            - year
          default:
            sort: year
            order: desc
        fields:
          - name: title
            label: Paper title
            type: string
            required: true
          - name: authors
            label: Authors
            type: text
          - name: journal
            label: Journal
            type: string
            required: true
          - name: year
            label: Year
            type: number
            required: true
          - name: volume
            label: Volume
            type: string
          - name: issue
            label: Issue
            type: string
          - name: pages
            label: Pages or article number
            type: string
          - name: bibliography
            label: Existing citation details (volume, issue, pages or article number)
            type: string
          - name: status
            label: Publication status (Accepted / In press / Early View / ASAP)
            type: string
          - name: doi
            label: DOI URL
            type: string
          - name: link
            label: Article URL
            type: string
          - name: area
            label: Research area
            type: string
          - name: publicationType
            label: Publication type
            type: string
          - name: coverType
            label: Cover feature (Front Cover / Back Cover)
            type: string
          - name: image
            label: Cover image
            type: image
          - name: featured
            label: Feature on home
            type: boolean
          - name: order
            label: Display order
            type: number
      - name: patents
        label: Patents
        type: collection
        path: src/content/patents
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields:
            - title
            - status
            - applicationDate
            - order
          primary: title
          sort:
            - applicationDate
          default:
            sort: applicationDate
            order: desc
        fields:
          - name: title
            label: Patent title
            type: string
            required: true
          - name: status
            label: Status
            type: select
            required: true
            options:
              values:
                - 출원
                - 등록
          - name: inventors
            label: Inventors
            type: text
          - name: applicationCountries
            label: Application countries
            type: string
            required: true
          - name: applicationDate
            label: Application date
            type: date
            required: true
          - name: applicationNumber
            label: Application number
            type: string
            required: true
          - name: registrationDate
            label: Registration date
            type: date
            default: ""
          - name: registrationNumber
            label: Registration number
            type: string
          - name: language
            label: Language
            type: string
          - name: researchArea
            label: Research area
            type: string
          - name: featured
            label: Featured
            type: boolean
            default: false
          - name: active
            label: Show on site
            type: boolean
            default: true
          - name: notes
            label: Source notes (audit)
            type: text
          - name: order
            label: Display order
            type: number
      - name: conferences
        label: Conferences
        type: collection
        path: src/content/conferences
        format: yaml-frontmatter
        filename:
          template: "{year}{month}{day}-{hour}{minute}{second}-{primary}.md"
          field: create
        view:
          fields:
            - event
            - year
            - type
            - order
          primary: event
          sort:
            - year
          default:
            sort: year
            order: desc
        fields:
          - name: year
            label: Event year
            type: number
            required: true
          - name: month
            label: Event month
            type: string
          - name: event
            label: Conference / Event
            type: string
            required: true
          - name: type
            label: Presentation type
            type: select
            options:
              values:
                - Poster
                - Oral Presentation
                - Invited Talk
                - Invited Lecture
                - Not specified
          - name: title
            label: Presentation title
            type: string
          - name: authors
            label: Authors
            type: text
          - name: location
            label: Location
            type: string
          - name: country
            label: Country
            type: string
          - name: language
            label: Language
            type: string
          - name: sourceYear
            label: Source year (audit)
            type: number
          - name: notes
            label: Source notes (audit)
            type: text
          - name: featured
            label: Featured
            type: boolean
            default: false
          - name: active
            label: Show on site
            type: boolean
            default: true
          - name: order
            label: Display order
            type: number
  - name: board
    label: Board
    type: group
    items:
      - name: notices
        label: Notices
        type: collection
        path: src/content/notices
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields:
            - title
            - date
            - pinned
          primary: title
          sort:
            - date
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: date
            label: Date
            type: date
            required: true
          - name: category
            label: Category
            type: string
          - name: sourceTitle
            label: Original title (reference)
            type: string
          - name: sourceUrl
            label: Original notice URL
            type: string
          - name: legacyViews
            label: Original view count
            type: number
          - name: image
            label: Image
            type: image
          - name: featured
            label: Feature on home
            type: boolean
          - name: active
            label: Show on site
            type: boolean
          - name: author
            label: Author
            type: string
          - name: attachment
            label: Attachment
            type: file
          - name: pinned
            label: Pinned
            type: boolean
          - name: body
            label: Content
            type: rich-text
            options:
              format: html
      - name: news
        label: News
        type: collection
        path: src/content/news
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields:
            - title
            - date
            - category
          primary: title
          sort:
            - date
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Headline
            type: string
            required: true
          - name: date
            label: Date
            type: date
            required: true
          - name: category
            label: Category
            type: string
          - name: summary
            label: Summary
            type: text
            required: true
          - name: image
            label: Thumbnail
            type: image
            options:
              path: public/images/news
          - name: imageFit
            label: Thumbnail display
            type: select
            options:
              values:
                - cover
                - contain
          - name: link
            label: External link
            type: string
          - name: featured
            label: Featured
            type: boolean
          - name: body
            label: Full story
            type: rich-text
            options:
              format: html
      - name: gallery
        label: Gallery
        type: collection
        path: src/content/gallery
        format: yaml-frontmatter
        filename: "{primary}.md"
        view:
          fields:
            - title
            - date
            - order
          primary: title
          sort:
            - date
          default:
            sort: date
            order: desc
        fields:
          - name: title
            label: Album title
            type: string
            required: true
          - name: date
            label: Date
            type: date
            required: true
          - name: category
            label: Category
            type: string
          - name: description
            label: Description
            type: text
          - name: cover
            label: Cover image
            type: image
            options:
              path: public/images/gallery
          - name: order
            label: Display order
            type: number
          - name: photos
            label: Photos · Add image
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                label: Photo
                type: image
                required: true
                options:
                  path: public/images/gallery
              - name: caption
                label: Caption
                type: text
  - name: contact
    label: Contact & Recruitment
    type: file
    path: src/data/contact.json
    format: json
    operations:
      delete: false
    fields:
      - name: labName
        label: Lab name
        type: string
      - name: institution
        label: Institution
        type: string
      - name: professor
        label: Professor or lab contact
        type: string
      - name: email
        label: Email
        type: string
      - name: phone
        label: Phone
        type: string
      - name: fax
        label: Fax
        type: string
      - name: building
        label: Building
        type: string
      - name: room
        label: Room
        type: string
      - name: address
        label: Address
        type: text
      - name: recruitmentIntro
        label: Recruitment introduction
        type: text
      - name: recruitmentInstructions
        label: How to apply
        type: text
      - name: opportunities
        label: Join us opportunities · Add item
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Opportunity
            type: string
          - name: description
            label: Description
            type: text
